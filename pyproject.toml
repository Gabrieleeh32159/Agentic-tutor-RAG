[project]
name = "challenge"
version = "0.1.0"
description = "Educational Content RAG Service -- take-home challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.36",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "greenlet>=3.5.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "streamlit>=1.40.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "puremagic>=1.27",
    "pillow>=10.0.0",
    "slowapi>=0.1.9",
    "langfuse>=3.0.0",
    "langchain>=1.3.8", # required by langfuse.langchain.CallbackHandler (unconditional import)
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "reportlab>=4.2.0"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
