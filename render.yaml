services:
  - type: web
    name: agentic-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Neon connection string. IMPORTANT (see README/deploy notes):
      #   - scheme must be   postgresql+asyncpg://
      #   - use the DIRECT host (not the -pooler endpoint)
      #   - replace ?sslmode=require with ?ssl=require   (asyncpg, not libpq)
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      # Set to the deployed Vercel URL (e.g. https://ask-your-pdfs.vercel.app)
      - key: FRONTEND_ORIGIN
        sync: false
      # Render sits behind a proxy: without this uvicorn ignores X-Forwarded-For
      # and rate limiting keys every client on the load-balancer IP.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
