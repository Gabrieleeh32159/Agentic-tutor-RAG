services:
  - type: web
    name: agentic-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Neon connection string. IMPORTANT (see README/deploy notes):
      #   - scheme must be   postgresql+asyncpg://
      #   - use the DIRECT host (not the -pooler endpoint)
      #   - replace ?sslmode=require with ?ssl=require   (asyncpg, not libpq)
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      # Allowed browser origins. Use the STABLE Vercel domain (not the per-deploy
      # URL): https://ask-your-pdfs.vercel.app. Comma-separate multiple origins.
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional regex for additional origins, e.g. Vercel preview deploys:
      #   https://ask-your-pdfs-[\w-]+\.vercel\.app
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
      # Render sits behind a proxy: without this uvicorn ignores X-Forwarded-For
      # and rate limiting keys every client on the load-balancer IP.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
